[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "physics_simulators"
description = "A collection of physics simulators."
requires-python = ">=3.10"
dynamic = ["version"]
license = "LGPL-3.0-only"
authors = [
  { name="Anonymous" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mujoco==3.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["physics_simulators*"]

[tool.setuptools.dynamic]
version = {attr = "physics_simulators._version.__version__"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
]
